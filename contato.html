<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Amigo Fiel - Contato</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background: #fdfbf7; color: #4a4a4a; }
        header { background: #ff6f61; color: white; padding: 25px; text-align: center; }
        nav { background: #e05a4c; padding: 12px; text-align: center; }
        nav a { color: white; margin: 0 15px; text-decoration: none; font-weight: bold; }
        nav a:hover { text-decoration: underline; }
        .container { max-width: 600px; margin: 40px auto; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border-top: 5px solid #ff6f61; }
        .form-group { margin-bottom: 15px; text-align: left; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        input, textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        button { background: #27ae60; color: white; border: none; padding: 12px 25px; border-radius: 25px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; }
        button:hover { background: #219653; }
    </style>
</head>
<body>
    <header>
        <h1>🐾 Amigo Fiel</h1>
    </header>
    <nav>
        <a href="index.html">Início</a>
        <a href="sobre.html">Sobre Nós</a>
        <a href="pets.html">Nossos Pets</a>
        <a href="galeria.html">Galeria</a>
        <a href="contato.html">Contato</a>
    </nav>
    <div class="container">
        <h2>Quero Adotar / Entrar em Contato</h2>
        <form>
            <div class="form-group">
                <label>Seu Nome:</label>
                <input type="text" placeholder="Digite seu nome completo">
            </div>
            <div class="form-group">
                <label>E-mail:</label>
                <input type="email" placeholder="Digite seu e-mail">
            </div>
            <div class="form-group">
                <label>Qual pet você tem interesse em adotar?</label>
                <input type="text" placeholder="Ex: Max, Mel ou outro">
            </div>
            <div class="form-group">
                <label>Mensagem / Motivo da Adoção:</label>
                <textarea rows="4" placeholder="Conte um pouco sobre sua casa e por que quer adotar"></textarea>
            </div>
            <button type="submit">Enviar Pedido de Adoção</button>
        </form>
    </div>
</body>
</html>
